name: Release 3D Sound

# RELEASE_VERSION 파일의 버전을 바꿔서 푸시하면 릴리스가 만들어진다.
on:
  push:
    paths:
      - "RELEASE_VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # 지금까지 배포한 APK 의 서명 인증서 (v2.0~). 다른 키로 서명되면 설치된 앱이 업데이트를 못 받으므로 릴리스를 멈춘다.
      # 키를 일부러 바꿀 때만 이 값을 새 인증서 값으로 바꾼다 (그때는 사용자가 앱을 한 번 지우고 설치해야 함)
      EXPECTED_CERT_SHA256: 069319a88c46f1e88f71838b8a96dd488714a7bee5c8ad9896a97f96a1707e40
    defaults:
      run:
        working-directory: spatial-audio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 서명 키를 항상 같게 (덮어쓰기 설치·앱 자동 업데이트에 필요)
      # - 저장소 비밀값 APK_SIGNING_SECRET 이 있으면 그 값에서 항상 같은 키를 만든다 (영구)
      # - 없으면 Actions 캐시에 보관한 키를 '읽기만' 한다. 여기서는 절대 새 키를 만들지 않는다
      #   (새 키로 배포하면 이미 설치된 앱이 업데이트를 못 받음). 캐시는 만든 브랜치(ccr-101057d7-9ssg5d)와
      #   기본 브랜치에서만 읽힌다. 키를 새로 만들어야 할 때만 keep-signing-key 워크플로를 create_if_missing 으로 실행
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.spatial-sign
          key: spatial-sound-signing-v2
      - name: Prepare signing key
        env:
          APK_SIGNING_SECRET: ${{ secrets.APK_SIGNING_SECRET }}
        run: |
          if [ -n "$APK_SIGNING_SECRET" ]; then
            python3 -m venv /tmp/signvenv && /tmp/signvenv/bin/pip -q install cryptography
            /tmp/signvenv/bin/python ../.github/scripts/apk_signing_key.py "$HOME/.spatial-sign-secret/key.p12" spatialsound
            echo "SPATIAL_SIGN_STORE=$HOME/.spatial-sign-secret/key.p12" >> "$GITHUB_ENV"
          elif [ -f "$HOME/.spatial-sign/release.p12" ]; then
            echo "SPATIAL_SIGN_STORE=$HOME/.spatial-sign/release.p12" >> "$GITHUB_ENV"
          else
            echo "::error::APK 서명 키(Actions 캐시 spatial-sound-signing-v2)를 찾지 못해 릴리스를 멈춥니다. 새 키로 배포하면 이미 설치된 앱이 업데이트를 못 받습니다. 이 캐시는 ccr-101057d7-9ssg5d 브랜치와 기본 브랜치에서만 읽히니 그 브랜치에서 릴리스하세요. 키를 잃었다면 keep-signing-key 워크플로를 create_if_missing 으로 실행하고 EXPECTED_CERT_SHA256 을 바꾼 뒤, 사용자에게 앱을 한 번 지우고 설치하라고 안내해야 합니다."
            exit 1
          fi
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../3DSound-Android.apk
      - name: Check signing certificate
        run: |
          got=$("$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs ../3DSound-Android.apk \
            | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)
          echo "서명 인증서 SHA-256: $got"
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK 서명 인증서($got)가 지금까지 배포한 것($EXPECTED_CERT_SHA256)과 달라 릴리스를 멈춥니다 — 이대로 배포하면 설치된 앱이 업데이트를 못 받습니다"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: 3DSound-Android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spatial-audio-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat --no-daemon fatJar
      - shell: pwsh
        run: |
          $ver = (Get-Content ../RELEASE_VERSION -Raw).Trim()
          jpackage --type app-image --name 3DSound --input build/libs --main-jar 3DSound.jar `
            --main-class com.spatialsound.desktop.MainKt --dest dist --app-version $ver `
            --java-options "-Dfile.encoding=UTF-8"
          Copy-Item README.md dist/3DSound/
          Compress-Archive -Path dist/3DSound -DestinationPath ../3DSound-Windows.zip
          Copy-Item build/libs/3DSound.jar ../3DSound-Mac-Linux.jar
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            3DSound-Windows.zip
            3DSound-Mac-Linux.jar

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 3D 사운드 v${{ steps.ver.outputs.v }}
          body_path: spatial-audio-android/RELEASE_NOTES.md
          files: |
            out/3DSound-Android.apk
            out/3DSound-Windows.zip
            out/3DSound-Mac-Linux.jar
