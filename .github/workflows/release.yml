name: Release 3D Sound

# RELEASE_VERSION 파일의 버전을 바꿔서 푸시하면 릴리스가 만들어진다.
on:
  push:
    paths:
      - "RELEASE_VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-audio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Android 빌드와 같은 서명 키 → 폰에서 덮어쓰기 업데이트 가능
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spatial-sound-debug-keystore-v1
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../3DSound-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: 3DSound-Android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spatial-audio-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat --no-daemon fatJar
      - shell: pwsh
        run: |
          jpackage --type app-image --name 3DSound --input build/libs --main-jar 3DSound.jar `
            --main-class com.spatialsound.desktop.MainKt --dest dist --app-version 1.0.0 `
            --java-options "-Dfile.encoding=UTF-8"
          Copy-Item README.md dist/3DSound/
          Compress-Archive -Path dist/3DSound -DestinationPath ../3DSound-Windows.zip
          Copy-Item build/libs/3DSound.jar ../3DSound-Mac-Linux.jar
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            3DSound-Windows.zip
            3DSound-Mac-Linux.jar

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(tr -d '[:space:]' < RELEASE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 3D 사운드 v${{ steps.ver.outputs.v }}
          body_path: spatial-audio-android/RELEASE_NOTES.md
          files: |
            out/3DSound-Android.apk
            out/3DSound-Windows.zip
            out/3DSound-Mac-Linux.jar
