name: Build 3D Sound PC app

# PC 앱(엔진은 안드로이드와 같은 파일)이 컴파일되는지 확인. 릴리스는 release.yml 에서.
on:
  push:
    paths:
      - "spatial-audio-desktop/**"
      - "spatial-audio-android/app/src/main/java/com/spatialsound/app/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-audio-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon fatJar
          echo "version: $(unzip -p build/libs/3DSound.jar spatial-sound-version.txt)"
          ls -la build/libs
