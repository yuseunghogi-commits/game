name: Deploy 3D Sound web app (GitHub Pages)

# 웹 앱을 GitHub Pages 에 올린다 → https://<계정>.github.io/<저장소>/
# 빌드 결과를 gh-pages 브랜치에 올리고, Pages 가 그 브랜치를 보여 준다.
on:
  push:
    paths:
      - "spatial-audio-web/**"
      - "spatial-audio-android/app/src/main/assets/**"
      - "RELEASE_VERSION"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python3 spatial-audio-web/build.py --pwa site
      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web app from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Pages 가 아직 꺼져 있으면 켜 보기 (권한이 없으면 저장소 설정에서 한 번 켜야 함)
      - name: Enable Pages (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o pages.json -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET pages: $code"; cat pages.json; echo
          if [ "$code" = "404" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}' -w "\nPOST pages: %{http_code}\n"
          fi
      - name: Site address
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
