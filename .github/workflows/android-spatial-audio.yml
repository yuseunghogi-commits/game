name: Build 3D Sound APK

on:
  push:
    paths:
      - "spatial-audio-android/**"
      - ".github/workflows/android-spatial-audio.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-audio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 빌드마다 서명 키가 바뀌면 폰에서 덮어쓰기 업데이트가 안 되므로
      # 디버그 서명 키를 캐시에 보관해 계속 같은 키로 서명한다.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spatial-sound-debug-keystore-v1
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-sound-apk
          path: spatial-audio-android/app/build/outputs/apk/release/*.apk
