name: Build 3D Sound APK

on:
  push:
    paths:
      - "spatial-audio-android/**"
      - ".github/workflows/android-spatial-audio.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-audio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-sound-apk
          path: spatial-audio-android/app/build/outputs/apk/release/*.apk
